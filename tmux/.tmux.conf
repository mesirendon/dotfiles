##### GENERAL #####
set -g default-terminal "tmux-256color"
# Fallback if terminfo missing
set -as terminal-overrides ',xterm-256color:RGB'
set -g escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g allow-rename off
setw -g xterm-keys on
setw -g aggressive-resize on
# Start from 0 (your preference)
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

##### MOUSE & COPY #####
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on

# Optional OSC52 helper (works over SSH if supported).
# Choose one copy command that exists in your system:
# set -g @osc52_copy_command 'xclip -selection clipboard -in'
# set -g @osc52_copy_command 'wl-copy'
# macOS: set -g @osc52_copy_command 'pbcopy'
set -g @plugin 'ojroques/tmux-osc52'

##### KEYS #####
# Splits
unbind '"'; unbind %
bind \\ split-window -h
bind -  split-window -v
# Reload
bind r source-file ~/.tmux.conf \; display-message 'tmux reloaded'
# Move panes (Alt + arrows)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Resize panes (Alt + hjkl)
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 5
# Toggle mouse quickly
bind m set -g mouse on  \; display 'Mouse: ON'
bind M set -g mouse off \; display 'Mouse: OFF'
# Toggle synchronize-panes (broadcast)
bind S setw synchronize-panes \; display 'Sync-panes: #{?synchronize-panes,ON,OFF}'
# Quick rename
bind , command-prompt -I "#W" "rename-window '%%'"

##### THEME: NORD #####
# Nord palette
set -g @nord0  "#2E3440"
set -g @nord1  "#3B4252"
set -g @nord2  "#434C5E"
set -g @nord3  "#4C566A"
set -g @nord4  "#D8DEE9"
set -g @nord5  "#E5E9F0"
set -g @nord6  "#ECEFF4"
set -g @nord7  "#8FBCBB"
set -g @nord8  "#88C0D0"
set -g @nord9  "#81A1C1"
set -g @nord10 "#5E81AC"
set -g @nord11 "#BF616A"
set -g @nord12 "#D08770"
set -g @nord13 "#EBCB8B"
set -g @nord14 "#A3BE8C"
set -g @nord15 "#B48EAD"

# Base surfaces
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-bg "#{@nord0}"
set -g status-fg "#{@nord4}"
set -g pane-border-style "fg=#{@nord2}"
set -g pane-active-border-style "fg=#{@nord9}"
setw -g mode-style "fg=#{@nord11},bg=#{@nord2}"
set -g message-style "fg=#{@nord0},bg=#{@nord13}"

##### STATUS & WINDOWS #####
# Toggle fancy glyphs (rounded pills). 1 = ON (requires Nerd Font), 0 = ASCII fallback
set -g @fancy_glyphs 0

# ASCII fallback (default)
if -b '[ "#{@fancy_glyphs}" = "0" ]' {
  # Windows
  setw -g window-status-style         "fg=#{@nord5},bg=#{@nord1}"
  setw -g window-status-format        ' [#I · #W] '
  setw -g window-status-current-style "fg=#{@nord0},bg=#{@nord8},bold"
  setw -g window-status-current-format ' {#I · #W} '
  setw -g window-status-bell-style    "fg=#{@nord0},bg=#{@nord11},bold"

  # Left: session name badge
  set -g status-left-length 40
  set -g status-left '#[fg=#{@nord0},bg=#{@nord10},bold] #S #[default]'

  # Right: prefix highlight + net/batt + clock
  set -g status-right-length 120
  set -g status-right '#{prefix_highlight} | #{net_speed} | Batt: #{battery_icon} #{battery_percentage} #{battery_remain} | %a %h-%d %H:%M'
} {
  # Fancy rounded pills (Nerd Font:  )
  # Windows
  setw -g window-status-style  "fg=#{@nord5},bg=#{@nord1}"
  setw -g window-status-format '#[fg=#{@nord1},bg=#{@nord0}]#[fg=#{@nord5},bg=#{@nord1}] #I · #W #[fg=#{@nord1},bg=#{@nord0}]'
  setw -g window-status-current-style  "fg=#{@nord0},bg=#{@nord8},bold"
  setw -g window-status-current-format '#[fg=#{@nord8},bg=#{@nord0}]#[fg=#{@nord0},bg=#{@nord8},bold] #I · #W #[fg=#{@nord8},bg=#{@nord0}]'
  setw -g window-status-bell-style     "fg=#{@nord0},bg=#{@nord11},bold"

  # Left: session name
  set -g status-left-length 40
  set -g status-left '#[fg=#{@nord10},bg=#{@nord0}]#[fg=#{@nord0},bg=#{@nord10},bold] #S #[fg=#{@nord10},bg=#{@nord0}] '

  # Right: segments
  set -g status-right-length 120
  set -g status-right '#{prefix_highlight} #[fg=#{@nord2},bg=#{@nord0}]#[fg=#{@nord6},bg=#{@nord2}] #{net_speed} #[fg=#{@nord2},bg=#{@nord0}] #[fg=#{@nord2},bg=#{@nord0}]#[fg=#{@nord6},bg=#{@nord2}] Batt: #{battery_icon} #{battery_percentage} #{battery_remain} #[fg=#{@nord2},bg=#{@nord0}] #[fg=#{@nord2},bg=#{@nord0}]#[fg=#{@nord6},bg=#{@nord2}] %a %h-%d %H:%M #[fg=#{@nord2},bg=#{@nord0}]'
}

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Plugin formatting (ASCII-safe)
set -g @batt_icon_status_charged '[OK]'
set -g @batt_icon_status_charging '[CHG]'
set -g @batt_icon_status_discharging '[BAT]'
set -g @download_speed_format "%7s"
set -g @upload_speed_format   "%7s"
set -g @net_speed_format "D:%7s U:%7s"
set -g @online_icon  '[ONLINE]'
set -g @offline_icon '[OFFLINE]'

# TPM path & init
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"

# Initialize TPM (keep last)
run -b '~/.tmux/plugins/tpm/tpm'
