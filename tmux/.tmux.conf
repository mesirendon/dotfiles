##### GENERAL #####
set -g default-terminal "tmux-256color"
# Fallback if terminfo missing
set -as terminal-overrides ',xterm-256color:RGB'
set -g escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g allow-rename off
setw -g xterm-keys on
setw -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### MOUSE & COPY #####
set -g mouse on
setw -g mode-keys vi
# tmux ≥3.2: integrate with system clipboard
set -g set-clipboard on
# OSC52 fallback (remote copy over SSH if terminal supports it)
set -g @plugin 'ojroques/tmux-osc52'
set -g @osc52_copy_command 'pbcopy'

##### KEYS #####
# Splits
unbind '"'; unbind %
bind \\ split-window -h
bind -  split-window -v
# Reload
bind r source-file ~/.tmux.conf \; display-message 'tmux reloaded'
# Move panes (Alt + arrows)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Resize panes (Alt + hjkl)
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 5
# Toggle mouse quickly
bind m set -g mouse on  \; display 'Mouse: ON'
bind M set -g mouse off \; display 'Mouse: OFF'
# Toggle synchronize-panes (broadcast)
bind S setw synchronize-panes \; display 'Sync-panes: #{?synchronize-panes,ON,OFF}'
# Quick rename
bind , command-prompt -I "#W" "rename-window '%%'"

##### LOOK & FEEL (light theme by default) #####
# Switch this to 'dark' if you prefer
set -g @theme 'light'

# Palette
if -b '[ "#{@theme}" = "light" ]' {
  set -g status-bg 'colour254'
  set -g status-fg 'colour238'
  set -g pane-border-style 'fg=colour250'
  set -g pane-active-border-style 'fg=colour169'
  setw -g mode-style 'fg=colour196,bg=colour252'   # copy/scroll colors
  set -g message-style 'fg=black,bg=colour229'
} {
  set -g status-bg 'colour234'
  set -g status-fg 'colour137'
  set -g pane-border-style 'fg=colour238'
  set -g pane-active-border-style 'fg=colour51'
  setw -g mode-style 'fg=colour196,bg=colour238'
  set -g message-style 'fg=colour232,bg=colour166'
}

set -g status-justify left
set -g status-interval 2
set -g status-position bottom

# Windows
setw -g window-status-style 'fg=colour238,bg=default'
setw -g window-status-format '  #I · #W  '
setw -g window-status-current-style 'fg=colour231,bg=colour33,bold'
setw -g window-status-current-format '  #I · #W  '
setw -g window-status-bell-style 'fg=colour255,bg=colour1'

##### STATUS (Nerd Font icons) #####
# Left: session name
set -g status-left-length 40
set -g status-left '#[bold]#S #[default]'

# Prefix highlight (plugin) appears in status-right
# Battery / Net speed / Online status (plugins) + clock
set -g status-right-length 120
set -g status-right '#{prefix_highlight} #[fg=colour240] #[default]#{net_speed} #[fg=colour240] #[default]Batt: #{battery_icon} #{battery_percentage} #{battery_remain} #[fg=colour240] #[default]%a %h-%d %H:%M'

# Plugin theming
set -g @batt_icon_status_charged ' '
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_discharging ' '
set -g @download_speed_format "%6s"
set -g @upload_speed_format   "%6s"
set -g @net_speed_format "D:%6s U:%6s"
set -g @online_icon  ''
set -g @offline_icon ''

##### TPM & PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# optional clipboard helper:
# set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (keep last)
run -b '~/.tmux/plugins/tpm/tpm'
