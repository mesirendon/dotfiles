##### GENERAL #####
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'
set -g escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g allow-rename off
setw -g xterm-keys on
setw -g aggressive-resize on

# Start counting from 0
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

##### MOUSE & COPY #####
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on
# Optional OSC52 helper (pick one in your OS later if you like)
set -g @plugin 'ojroques/tmux-osc52'
# Examples:
# set -g @osc52_copy_command 'pbcopy'     # macOS
# set -g @osc52_copy_command 'xclip -selection clipboard -in'  # X11
# set -g @osc52_copy_command 'wl-copy'    # Wayland

##### KEYS #####
unbind '"'; unbind %
bind \\ split-window -h
bind -  split-window -v
bind r  source-file ~/.tmux.conf \; display-message 'tmux reloaded'

# Pane navigation with Alt + arrows
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize with Alt + hjkl
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 5

# Toggle mouse
bind m set -g mouse on  \; display 'Mouse: ON'
bind M set -g mouse off \; display 'Mouse: OFF'

# Toggle synchronize-panes (broadcast)
bind S setw synchronize-panes \; display 'Sync-panes: #{?synchronize-panes,ON,OFF}'

# Quick rename window
bind , command-prompt -I "#W" "rename-window '%%'"

##### THEME — NORD #####
# Base surfaces (hard-coded Nord hex colors)
set -g status-interval 2
set -g status-position bottom
set -g status-justify left

set -g status-bg "#2E3440"                 # nord0
set -g status-fg "#D8DEE9"                 # nord4
set -g pane-border-style "fg=#434C5E"      # nord2
set -g pane-active-border-style "fg=#81A1C1" # nord9
setw -g mode-style "fg=#BF616A,bg=#434C5E" # copy mode: nord11 on nord2
set -g message-style "fg=#2E3440,bg=#EBCB8B" # messages: nord0 on nord13

##### STATUS & WINDOWS #####
# 0 = ASCII fallback (default), 1 = rounded “pills” (requires Nerd Font)
set -g @fancy_glyphs 0

# ASCII-safe defaults
if -F '#{==:#{@fancy_glyphs},0}' {
  # Windows
  setw -g window-status-style         "fg=#E5E9F0,bg=#3B4252"           # nord5 on nord1
  setw -g window-status-format        ' [#I · #W] '
  setw -g window-status-current-style "fg=#2E3440,bg=#88C0D0,bold"      # nord0 on nord8
  setw -g window-status-current-format ' {#I · #W} '
  setw -g window-status-bell-style    "fg=#2E3440,bg=#BF616A,bold"      # alert: nord0 on nord11

  # Left badge: session name
  set -g status-left-length 40
  set -g status-left '#[fg=#2E3440,bg=#5E81AC,bold] #S #[default]'     # nord0 on nord10

  # Right segments: prefix highlight | net | batt | clock
  set -g status-right-length 120
  set -g status-right '#{prefix_highlight} | #{net_speed} | Batt: #{battery_icon} #{battery_percentage} #{battery_remain} | %a %h-%d %H:%M'
}

# Fancy rounded (Nerd Font needed for  )
if -F '#{==:#{@fancy_glyphs},1}' {
  # Windows
  setw -g window-status-style  "fg=#E5E9F0,bg=#3B4252"                  # nord5 on nord1
  setw -g window-status-format '#[fg=#3B4252,bg=#2E3440]#[fg=#E5E9F0,bg=#3B4252] #I · #W #[fg=#3B4252,bg=#2E3440]'
  setw -g window-status-current-style  "fg=#2E3440,bg=#88C0D0,bold"     # nord0 on nord8
  setw -g window-status-current-format '#[fg=#88C0D0,bg=#2E3440]#[fg=#2E3440,bg=#88C0D0,bold] #I · #W #[fg=#88C0D0,bg=#2E3440]'
  setw -g window-status-bell-style     "fg=#2E3440,bg=#BF616A,bold"     # alert

  # Left: session name pill
  set -g status-left-length 40
  set -g status-left '#[fg=#5E81AC,bg=#2E3440]#[fg=#2E3440,bg=#5E81AC,bold] #S #[fg=#5E81AC,bg=#2E3440] '

  # Right: net, batt, clock pills (with separators)
  set -g status-right-length 120
  set -g status-right '#{prefix_highlight} #[fg=#434C5E,bg=#2E3440]#[fg=#ECEFF4,bg=#434C5E] #{net_speed} #[fg=#434C5E,bg=#2E3440] #[fg=#434C5E,bg=#2E3440]#[fg=#ECEFF4,bg=#434C5E] Batt: #{battery_icon} #{battery_percentage} #{battery_remain} #[fg=#434C5E,bg=#2E3440] #[fg=#434C5E,bg=#2E3440]#[fg=#ECEFF4,bg=#434C5E] %a %h-%d %H:%M #[fg=#434C5E,bg=#2E3440]'
}

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# Optional:
# set -g @plugin 'tmux-plugins/tmux-yank'

# ASCII-safe plugin icon formats (change if you prefer)
set -g @batt_icon_status_charged '[OK]'
set -g @batt_icon_status_charging '[CHG]'
set -g @batt_icon_status_discharging '[BAT]'
set -g @download_speed_format "%7s"
set -g @upload_speed_format   "%7s"
set -g @net_speed_format "D:%7s U:%7s"
set -g @online_icon  '[ONLINE]'
set -g @offline_icon '[OFFLINE]'

# TPM install path & init
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"

# Initialize TPM (keep at bottom)
run -b '~/.tmux/plugins/tpm/tpm'
