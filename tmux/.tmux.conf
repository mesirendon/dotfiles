##### GENERAL #####
set -g escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g allow-rename off
setw -g xterm-keys on
setw -g aggressive-resize on

# Start counting from 0
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

##### MOUSE & COPY #####
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on
# Optional OSC52 helper (pick one later for your OS)
set -g @plugin 'ojroques/tmux-osc52'
# Set on the system:
set -g @osc52_copy_command 'pbcopy'     # macOS
# set -g @osc52_copy_command 'xclip -selection clipboard -in'  # X11
# set -g @osc52_copy_command 'wl-copy'    # Wayland

##### KEYS #####
unbind '"'; unbind %
bind \\ split-window -h
bind -  split-window -v
bind r  source-file ~/.tmux.conf \; display-message 'tmux reloaded'

# Pane navigation with Alt + arrows
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize with Alt + hjkl
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 5

# Toggle mouse
bind m set -g mouse on  \; display 'Mouse: ON'
bind M set -g mouse off \; display 'Mouse: OFF'

# Toggle synchronize-panes (broadcast)
bind S setw synchronize-panes \; display 'Sync-panes: #{?synchronize-panes,ON,OFF}'

# Quick rename window
bind , command-prompt -I "#W" "rename-window '%%'"

##### STATUS BAR #####
set -g status on
set -g status-right-length 120
set -g status-right '#{prefix_highlight} | #{net_speed} | Batt: #{battery_icon} #{battery_percentage} #{battery_remain} | #{online_status} | %a %h-%d %H:%M'

# Prefix highlight options
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow,bold'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=green'

##### PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'tmux-plugins/tmux-yank'

# ASCII-safe plugin icon formats
set -g @batt_icon_status_charged '[OK]'
set -g @batt_icon_status_charging '[CHG]'
set -g @batt_icon_status_discharging '[BAT]'
set -g @download_speed_format "%7s"
set -g @upload_speed_format   "%7s"
set -g @net_speed_format "D:%7s U:%7s"
set -g @online_icon  '[ONLINE]'
set -g @offline_icon '[OFFLINE]'

# TPM install path & init
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"
run -b '~/.tmux/plugins/tpm/tpm'
